<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e8d9bb"><title>Книга моей жизни</title><style>
@import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap");:root{font-family:"Manrope",Arial,sans-serif;color:#4b3927;background:#e3d2b3}*{box-sizing:border-box}html{width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{margin:0;background:radial-gradient(circle at 20% 5%,#f5ead6,#dfcbaa);height:100%;width:100%;overflow:hidden;overscroll-behavior:none}button,input,textarea{font:inherit}button{cursor:pointer;border:0}button:active{transform:scale(.94)}button{transition:transform .18s,background .2s}.app{width:100%;max-width:640px;margin:auto;height:100dvh;min-height:0;overflow:hidden;display:flex;flex-direction:column}.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 17px;gap:8px}.bar button,.circle{border-radius:100px;background:#fff6e7aa;color:#493923;padding:11px 13px;box-shadow:0 2px 10px #58391519}.bar strong{font-family:"Cormorant Garamond",Georgia,serif;font-size:14px;font-weight:500;letter-spacing:.08em}.stage{flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:0 15px;perspective:1200px;touch-action:pan-y}.sheet{position:relative;width:min(100%,430px,calc((100dvh - 190px)*.71));max-height:calc(100dvh - 190px);aspect-ratio:.71;background:linear-gradient(126deg,#fcf2dc,#f0e1c4);box-shadow:5px 8px 18px #6c4e2c36,inset 8px 0 12px #8e735022;border-radius:3px 10px 10px 3px;padding:22px 19px;display:flex;flex-direction:column;transition:transform .35s,opacity .25s;transform-origin:left center}.sheet.flipnext{animation:flipnext .68s cubic-bezier(.22,.61,.25,1)}.sheet.flipprev{animation:flipprev .68s cubic-bezier(.22,.61,.25,1)}@keyframes flipnext{0%{transform:rotateY(-17deg) translateX(9px);filter:brightness(.94)}55%{transform:rotateY(4deg) translateX(-2px)}100%{transform:rotateY(0) translateX(0);filter:brightness(1)}}@keyframes flipprev{0%{transform:rotateY(17deg) translateX(-9px);filter:brightness(.94)}55%{transform:rotateY(-4deg) translateX(2px)}100%{transform:rotateY(0) translateX(0);filter:brightness(1)}}@media(prefers-reduced-motion:reduce){.sheet.flipnext,.sheet.flipprev{animation:none}}.cover{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center}.cover h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(28px,8vw,46px);letter-spacing:.06em;margin:0}.cover .city{font-family:"Manrope",Arial,sans-serif;margin-top:auto;letter-spacing:.3em;font-size:12px}.photo{display:flex;flex-direction:column;flex:1;min-height:0;position:relative}.print{background:white;padding:7px;box-shadow:0 4px 13px #48352250;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.print img{display:block;max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}.note{font-family:"Manrope",Arial,sans-serif;position:relative;margin-top:16px;min-height:57px;max-height:67px;overflow:hidden;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;cursor:pointer}.note.open{position:absolute;bottom:0;left:0;right:0;z-index:4;max-height:65%;height:auto;overflow:auto;background:#fcf4e4f2;box-shadow:0 -8px 22px #553b2c2a;padding:16px;border-radius:12px}.editor{position:absolute;bottom:0;left:0;right:0;background:#fffaf0;box-shadow:0 -9px 26px #64442d50;padding:12px;border-radius:14px;z-index:8}.editor textarea{width:100%;min-height:135px;font-size:16px;background:transparent;border:0;outline:0;resize:vertical;color:#4b3927;font-size:15px}.editor .actions{display:flex;justify-content:space-between;align-items:center}}.delete-photo{align-self:flex-end;background:#fff5e9;color:#8a392d;border-radius:15px;padding:7px 11px;margin-bottom:8px;font-size:12px}.primary{background:#65513b;color:white;border-radius:20px;padding:10px 16px}.footer{flex-shrink:0;min-width:0;padding:9px 16px max(16px,env(safe-area-inset-bottom))}.nav{display:flex;align-items:center;justify-content:space-between;gap:10px}.nav button{background:#fff3de;color:#59432e;border-radius:99px;padding:12px 16px}.nav span{font-size:12px;color:#6b5943}.nav input{width:100%;accent-color:#806549}.thumbs{width:100%;max-width:100%;display:flex;overflow-x:auto;overscroll-behavior-x:contain;gap:8px;padding:9px 0;scrollbar-width:thin}.thumb{flex:0 0 48px;width:48px;height:64px;background:#f8ecd7;border:2px solid transparent;border-radius:3px;display:grid;place-items:center;overflow:hidden;font-size:10px;text-align:center}.thumb.active{border-color:#6e5134}.thumb img{width:100%;height:100%;object-fit:cover}.overlay{position:fixed;inset:0;background:#2f2318a8;z-index:30;display:flex;align-items:center;justify-content:center;padding:15px}.modal{background:#fbf0d9;padding:22px;border-radius:15px;max-width:430px;width:100%;max-height:85dvh;overflow:auto;box-shadow:0 9px 30px #0004}.modal h2{font-size:19px}.modal button{padding:12px 14px;background:#f3e5ca;color:#483725;border:1px solid #dbc6a3;border-radius:14px;margin:5px;box-shadow:0 3px 8px #76522f14;transition:transform .2s,background .2s,box-shadow .2s}.modal button:active{transform:scale(.96);background:#e7d0aa}.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.modal .menu-btn{display:flex;align-items:center;gap:10px;justify-content:flex-start;text-align:left;min-height:65px;margin:0;border-radius:16px;background:linear-gradient(140deg,#fff8e9,#e9d8b9)}.menu-icon{font-size:23px;width:29px;flex-shrink:0;text-align:center}.menu-label{font-size:12px;font-weight:600;line-height:1.35}.modal .menu-btn.danger{background:#f6e5df;color:#854337;border-color:#e5c5b9}.modal .menu-btn:disabled{opacity:.4;cursor:default}.modal label{display:block;margin:13px 0}.modal input{max-width:100%}.hidden{display:none!important}.hint{font-size:12px;line-height:1.5;color:#735c43}.floatadd{position:fixed;bottom:calc(105px + env(safe-area-inset-bottom));right:max(16px,calc((100vw - 610px)/2));border-radius:50%;padding:15px;font-size:24px;background:#705538;color:white;box-shadow:0 5px 15px #42301c66;z-index:10}@media print{@page{size:A4;margin:0}body{background:white}.app,.floatadd,.overlay{display:none!important}#printPages{display:block!important}.paper{width:210mm;height:297mm;page-break-after:always;break-after:page;display:grid;grid-template-columns:repeat(3,64mm);grid-template-rows:repeat(3,85.3mm);column-gap:1mm;row-gap:1mm;justify-content:center;align-content:center}.paper img{width:64mm;height:85.3mm;object-fit:cover;display:block}}#printPages{display:none}
</style><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"></head><body><div class="app"><header class="bar"><button id="menu" aria-label="Меню">☰</button><strong id="title"></strong><button id="today">Сегодня</button></header><main class="stage"><div id="sheet" class="sheet"></div></main><footer class="footer"><div class="nav"><button id="prev" aria-label="Назад">❮</button><span id="pageNo"></span><button id="next" aria-label="Вперёд">❯</button></div><input id="range" type="range" min="0" max="0" value="0" aria-label="Быстрый переход"><div id="thumbs" class="thumbs"></div></footer></div><button id="add" class="floatadd" title="Добавить фотографию">＋</button><input hidden id="camera" type="file" accept="image/*" capture="environment"><input hidden id="gallery" type="file" accept="image/*" multiple><input hidden id="restore" type="file" accept=".json,application/json"><div id="modal" class="overlay hidden"><div class="modal" id="modalBody"></div></div><div id="printPages"></div><script>
const $=id=>document.getElementById(id), dbName='life-book-v1';let db,photos=[],pages=[],index=0,editing=false,expanded=false,listening=false,recognition=null,lastPhotoAt=Date.now(),noticeTimer;
const fmt=d=>new Date(d).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'Europe/Moscow'});
const day=d=>new Date(d).toLocaleDateString('sv-SE',{timeZone:'Europe/Moscow'});
const today=()=>day(Date.now());const city='МОСКВА';
function request(tx,store,key){return new Promise((resolve,reject)=>{let q=tx.objectStore(store).get(key);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
function transaction(mode='readonly'){return db.transaction('photos',mode)}
function wait(tx){return new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function start(){db=await new Promise((resolve,reject)=>{let q=indexedDB.open(dbName,1);q.onupgradeneeded=()=>q.result.createObjectStore('photos',{keyPath:'id'});q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});await reload();jumpToday();setInterval(()=>{if(Date.now()-lastPhotoAt>7200000&&Notification.permission==='granted'){new Notification('Книга моей жизни',{body:'Сфотографируй сегодняшний момент'});lastPhotoAt=Date.now()}},60000)}
async function reload(){photos=await new Promise((resolve,reject)=>{let q=transaction().objectStore('photos').getAll();q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});photos.sort((a,b)=>a.taken-b.taken);build()}
function build(){let groups=new Map();for(let p of photos){let d=day(p.taken);if(!groups.has(d))groups.set(d,[]);groups.get(d).push(p)}if(!groups.has(today()))groups.set(today(),[]);pages=[];for(let d of [...groups.keys()].sort()){pages.push({type:'date',date:d});for(let p of groups.get(d))pages.push({type:'photo',p})}if(index>=pages.length)index=pages.length-1;renderThumbs();render()}
function jumpToday(){let i=pages.findIndex(p=>p.type==='date'&&p.date===today());go(Math.max(0,i))}
function go(n){if(n<0||n>=pages.length)return;let old=index;index=n;expanded=false;editing=false;render();$('sheet').classList.remove('flipnext','flipprev');void $('sheet').offsetWidth;$('sheet').classList.add(n>=old?'flipnext':'flipprev');renderThumbs()}
function render(){let p=pages[index];if(!p)return;let sh=$('sheet');sh.innerHTML='';$('title').textContent='';$('pageNo').textContent=(index+1)+' / '+pages.length;$('range').max=Math.max(0,pages.length-1);$('range').value=index;
if(p.type==='date'){let a=document.createElement('div');a.className='cover';let h=document.createElement('h1');h.textContent=fmt(p.date+'T12:00:00+03:00');let c=document.createElement('div');c.className='city';c.textContent=city;a.append(h,c);sh.append(a);return}
let wrap=document.createElement('div');wrap.className='photo';let frame=document.createElement('div');frame.className='print';let img=document.createElement('img');img.alt='Фотография';img.src=URL.createObjectURL(p.p.blob);img.onload=()=>URL.revokeObjectURL(img.src);frame.append(img);wrap.append(frame);let n=document.createElement('div');n.className='note'+(expanded?' open':'');n.textContent=p.p.note||'Нажми здесь, чтобы написать воспоминание';n.onclick=()=>edit();wrap.append(n);if(editing)attachEditor(wrap,p.p);sh.append(wrap)}
function attachEditor(wrap,p){let div=document.createElement('div');div.className='editor';let input=document.createElement('textarea');input.value=p.note||'';input.placeholder='Напиши воспоминание…';let bottom=document.createElement('div');bottom.className='actions';let save=document.createElement('button');save.className='primary';save.textContent='Сохранить';save.onclick=async()=>{p.note=input.value;await put(p);editing=false;expanded=false;render()};bottom.append(save);div.append(input,bottom);wrap.append(div);input.focus()}
function edit(){editing=true;expanded=false;render()}
async function put(p){let tx=transaction('readwrite');tx.objectStore('photos').put(p);await wait(tx)}
async function removePhoto(){let p=pages[index];if(p?.type!=='photo'||!confirm('Удалить фотографию вместе с её страницей? Отменить это действие нельзя.'))return;let tx=transaction('readwrite');tx.objectStore('photos').delete(p.p.id);await wait(tx);await reload()}
function renderThumbs(){let bar=$('thumbs');bar.innerHTML='';pages.forEach((p,i)=>{let b=document.createElement('button');b.className='thumb'+(i===index?' active':'');if(p.type==='date')b.textContent=p.date.slice(5);else{let im=document.createElement('img');im.src=URL.createObjectURL(p.p.blob);im.onload=()=>URL.revokeObjectURL(im.src);b.append(im)}b.onclick=()=>go(i);bar.append(b)});bar.children[index]?.scrollIntoView({block:'nearest',inline:'nearest'})}
function popup(html){$('modalBody').innerHTML=html;$('modal').classList.remove('hidden')}
function close(){ $('modal').classList.add('hidden')}
function menu(){popup('<h2>Книга моей жизни</h2><div class="menu-grid"><button class="menu-btn" id="goto"><span class="menu-icon">▤</span><span class="menu-label">Номер страницы</span></button><button class="menu-btn" id="date"><span class="menu-icon">▦</span><span class="menu-label">Перейти к дате</span></button><button class="menu-btn" id="import"><span class="menu-icon">▧</span><span class="menu-label">Добавить фото</span></button><button class="menu-btn" id="print"><span class="menu-icon">▣</span><span class="menu-label">Печать А4</span></button><button class="menu-btn" id="backup"><span class="menu-icon">⇩</span><span class="menu-label">Резервная копия</span></button><button class="menu-btn" id="load"><span class="menu-icon">⇧</span><span class="menu-label">Восстановить</span></button><button class="menu-btn" id="notify"><span class="menu-icon">♧</span><span class="menu-label">Напоминания</span></button><button class="menu-btn danger" id="delete"><span class="menu-icon">♜</span><span class="menu-label">Удалить фото и страницу</span></button></div><p class="hint">Фотографии сохраняются в этом браузере на устройстве. Регулярно создавай резервную копию.</p>');$('delete').disabled=pages[index]?.type!=='photo';$('goto').onclick=()=>popup('<h2>Номер страницы</h2><input id="num" type="number" min="1" max="'+pages.length+'" value="'+(index+1)+'"><button id="ok">Перейти</button>');$('date').onclick=()=>popup('<h2>Перейти к дате</h2><input id="day" type="date" value="'+today()+'"><button id="okday">Перейти</button>');$('import').onclick=()=>{close();$('gallery').click()};$('print').onclick=()=>{close();printAll()};$('backup').onclick=()=>{close();backup()};$('load').onclick=()=>{close();$('restore').click()};$('delete').onclick=()=>{close();removePhoto()};$('notify').onclick=async()=>{if(!('Notification' in window)){alert('Уведомления недоступны в этом браузере.');return}let perm=await Notification.requestPermission();alert(perm==='granted'?'Напоминания разрешены, пока приложение открыто.':'Разрешение не получено.')}}
$('modalBody').addEventListener('click',e=>{if(e.target.id==='ok'){go(Math.max(0,Math.min(pages.length-1,(+$('num').value||1)-1)));close()}if(e.target.id==='okday'){let d=$('day').value;let i=pages.findIndex(x=>x.type==='date'&&x.date>=d);go(i<0?pages.length-1:i);close()}});
function exifDate(buf){try{let v=new DataView(buf);if(v.getUint16(0)!==0xffd8)return null;let pos=2;while(pos+4<v.byteLength){if(v.getUint8(pos)!==255)break;let marker=v.getUint8(pos+1),len=v.getUint16(pos+2);if(marker===0xe1&&v.getUint32(pos+4)===0x45786966){let t=pos+10,le=v.getUint16(t)===0x4949;let u16=x=>v.getUint16(x,le),u32=x=>v.getUint32(x,le);let ifd=t+u32(t+4);let find=(at,tag)=>{let n=u16(at);for(let i=0;i<n;i++){let x=at+2+i*12;if(u16(x)===tag)return u32(x+8)}return 0};let ex= find(ifd,0x8769);if(ex){let off=find(t+ex,0x9003);if(off){let s='';for(let i=0;i<19;i++)s+=String.fromCharCode(v.getUint8(t+off+i));let m=s.match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/);if(m)return new Date(m[1]+'-'+m[2]+'-'+m[3]+'T'+m[4]+':'+m[5]+':'+m[6]+'+03:00').getTime()}}}pos+=len+2}return null}catch{return null}}
async function addFiles(files){let count=0;for(let f of files){if(!f.type.startsWith('image/'))continue;let buf=await f.arrayBuffer();let taken=exifDate(buf)||f.lastModified||Date.now();let p={id:crypto.randomUUID(),taken,blob:new Blob([buf],{type:f.type}),note:''};await put(p);count++}lastPhotoAt=Date.now();await reload();let target=photos.at(-1);if(target)go(pages.findIndex(x=>x.type==='photo'&&x.p.id===target.id));alert('Добавлено фотографий: '+count)}
function download(blob,name){let a=document.createElement('a');let url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
async function backup(){let out=[];for(let p of photos){let b=await p.blob.arrayBuffer();let bytes=new Uint8Array(b);let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.slice(i,i+8192));out.push({id:p.id,taken:p.taken,note:p.note,type:p.blob.type,data:btoa(binary)})}download(new Blob([JSON.stringify({version:1,photos:out})],{type:'application/json'}),'kniga-moey-zhizni-backup.json')}
async function restore(file){try{let data=JSON.parse(await file.text());if(!Array.isArray(data.photos))throw Error('Неверный архив');for(let p of data.photos){let bytes=Uint8Array.from(atob(p.data),c=>c.charCodeAt(0));await put({id:p.id,taken:p.taken,note:p.note,blob:new Blob([bytes],{type:p.type})})}await reload();alert('Восстановлено фотографий: '+data.photos.length)}catch(e){alert('Ошибка восстановления: '+e.message)}}
function printAll(){let area=$('printPages');area.innerHTML='';for(let i=0;i<photos.length;i+=9){let paper=document.createElement('div');paper.className='paper';for(let p of photos.slice(i,i+9)){let img=document.createElement('img');img.src=URL.createObjectURL(p.blob);paper.append(img)}area.append(paper)}if(!photos.length)return alert('Сначала добавь фотографии');setTimeout(()=>window.print(),350)}
$('menu').onclick=menu;$('today').onclick=jumpToday;$('prev').onclick=()=>go(index-1);$('next').onclick=()=>go(index+1);$('range').oninput=e=>go(+e.target.value);$('add').onclick=()=>popup('<h2>Добавить фотографию</h2><button id="shoot">📷 Сфотографировать</button><button id="choose">▣ Из галереи</button>');$('modalBody').addEventListener('click',e=>{if(e.target.id==='shoot'){close();$('camera').click()}if(e.target.id==='choose'){close();$('gallery').click()}});$('camera').onchange=e=>addFiles(e.target.files);$('gallery').onchange=e=>addFiles(e.target.files);$('restore').onchange=e=>e.target.files[0]&&restore(e.target.files[0]);$('modal').onclick=e=>{if(e.target===$('modal'))close()};
let touchX=0;$('sheet').addEventListener('touchstart',e=>touchX=e.touches[0].clientX,{passive:true});$('sheet').addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>65&&!editing)go(index+(dx<0?1:-1))},{passive:true});document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});start().catch(e=>{alert('Не удалось открыть хранилище: '+e.message)});
</script></body></html>
